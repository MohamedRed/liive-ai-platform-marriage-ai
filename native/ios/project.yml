name: JustMarriage
options:
  bundleIdPrefix: com.liive
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  JustMarriage:
    type: application
    platform: iOS
    sources:
      - JustMarriage
    info:
      path: JustMarriage/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liive.justmarriage
        INFOPLIST_FILE: JustMarriage/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
